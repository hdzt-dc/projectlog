name: Final London Housing Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "predict_house.py"
      - "api.py"
      - "requirements.txt"
      - "final_deployment_package/**"
      - ".github/workflows/final-london-smoke-test.yml"
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify package imports and local prediction
        run: |
          python - <<'PY'
          import json
          import pandas as pd
          import sklearn
          from predict_house import predict_house

          print("pandas:", pd.__version__)
          print("scikit-learn:", sklearn.__version__)

          result = predict_house(
              year=2024,
              postcode="E14 9GU",
              borough="Tower_Hamlets",
              propertytype="F",
              duration="L",
              tfarea=70,
              numberrooms=3,
              current_energy_efficiency=72,
              potential_energy_efficiency=82,
              construction_age_clean="2007 onwards",
          )

          required = [
              "estimated_price",
              "model_used",
              "router_probability",
              "routed_to_specialist",
              "historical_accuracy",
          ]
          missing = [k for k in required if k not in result]
          if missing:
              raise SystemExit(f"Missing prediction fields: {missing}")

          accuracy = result["historical_accuracy"]
          if accuracy.get("test_period") != "2024":
              raise SystemExit("historical_accuracy.test_period is not 2024")

          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Wait for Render deployment health
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request

          url = "https://london-housing-api-xdcj.onrender.com/health"

          last_error = None
          for attempt in range(1, 31):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      body = json.loads(r.read().decode("utf-8"))
                  print("health:", body)
                  if (
                      body.get("status") == "healthy"
                      and body.get("model_version") == "3.0-final-2024-tested"
                  ):
                      print("Render health check PASS")
                      break
                  last_error = RuntimeError(f"Unexpected body: {body}")
              except Exception as e:
                  last_error = e

              print(f"Attempt {attempt}/30 not ready: {last_error}")
              time.sleep(20)
          else:
              raise SystemExit(f"Render did not become healthy: {last_error}")
          PY

      - name: Verify live prediction endpoint
        run: |
          python - <<'PY'
          import json
          import urllib.request

          url = "https://london-housing-api-xdcj.onrender.com/predict"
          payload = {
              "year": 2024,
              "postcode": "E14 9GU",
              "borough": "Tower_Hamlets",
              "propertytype": "F",
              "duration": "L",
              "tfarea": 70,
              "numberrooms": 3,
              "current_energy_efficiency": 72,
              "potential_energy_efficiency": 82,
              "construction_age_clean": "2007 onwards"
          }

          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(req, timeout=60) as r:
              body = json.loads(r.read().decode("utf-8"))

          print(json.dumps(body, indent=2, ensure_ascii=False))

          if body.get("success") is not True:
              raise SystemExit("Live /predict did not return success=true")

          prediction = body.get("prediction", {})
          for key in [
              "estimated_price",
              "model_used",
              "router_probability",
              "routed_to_specialist",
              "historical_accuracy",
          ]:
              if key not in prediction:
                  raise SystemExit(f"Live response missing {key}")

          accuracy = prediction["historical_accuracy"]
          if accuracy.get("test_period") != "2024":
              raise SystemExit("Live response does not expose 2024 accuracy")

          print("LIVE PREDICTION SMOKE TEST: PASS")
          PY
